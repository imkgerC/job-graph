<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pfandzähler</title>
    <link rel="manifest" href="counter.json" />
    <style>
        body,
        html {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #FFF;
            height: 100vh;
            overflow: hidden;
        }

        #main {
            position: absolute;
            color: #222;
            height: 100%;
            top: 0%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-end;
            font-size: 4em;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        #main-container {
            height: 100%;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }

        #counter {
            text-align: center;
        }
        #lastUpdate {
            position: absolute;
            top: 0%;
            left: 0%;
            padding: 0.25em;
            font-size: 0.5em;
        }
        .button {
            background-color: #123456;
            border: none;
            color: #eee;
            padding: 0.5em 1em;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 1em;
            margin: 0.1em 0.05em;
            cursor: pointer;
        }
        .button:hover {
            background-color: #234567;
        }
        .button:active {
            background-color: #123456;
        }
        .increment-button {
            background-color: #125634;
        }
        .increment-button:hover {
            background-color: #236745;
        }
        .increment-button:active {
            background-color: #125634;
        }
        .decrement-button {
            background-color: #561234;
        }
        .decrement-button:hover {
            background-color: #672345;
        }
        .decrement-button:active {
            background-color: #561234;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="lastUpdate"></div>
        <div id="main-container">
            <div id="counter">0.00€</div>
            <div>
                <button class="button decrement-button" data-increment="-0.25">-0.25€</button>
                <button class="button increment-button" data-increment="0.25">+0.25€</button>
            </div>
            <div>
                <button class="button decrement-button" data-increment="-0.15">-0.15€</button>
                <button class="button increment-button" data-increment="0.15">+0.15€</button>
            </div>
            <div>
                <button class="button decrement-button" data-increment="-0.08">-0.08€</button>
                <button class="button increment-button" data-increment="0.08">+0.08€</button>
            </div>
            <button class="button" id="reset-button">Reset</button>
        </div>
    </div>
</body>
<script>
    function formatRelativeTime(date1, date2 = new Date()) {
        const units = [
            { name: 'year', limit: 31536000000, inSeconds: 60 * 60 * 24 * 365 },
            { name: 'month', limit: 2592000000, inSeconds: 60 * 60 * 24 * 30 },
            { name: 'week', limit: 604800000, inSeconds: 60 * 60 * 24 * 7 }, 
            { name: 'day', limit: 86400000, inSeconds: 60 * 60 * 24 },
            { name: 'hour', limit: 3600000, inSeconds: 60 * 60 },
            { name: 'minute', limit: 60000, inSeconds: 60 },
            { name: 'second', limit: 1000, inSeconds: 1 }
        ];

        const diff = Math.abs(date1 - date2);
        const formatter = new Intl.RelativeTimeFormat(navigator.language, { numeric: 'auto' });

        for (const unit of units) {
            if (diff >= unit.limit) {
                const value = Math.floor(diff / unit.limit);
                return formatter.format(Math.sign(date1 - date2) * value, unit.name);
            }
        }

        return formatter.format(0, 'second'); // Default to "now" if the difference is very small
    }

    (() => {

        const updateCounter = () => {
            localStorage.setItem("counterValue", counterValue);
            localStorage.setItem("lastUpdate", lastUpdate);
            document.getElementById("counter").innerText = `${counterValue.toFixed(2)}€`;
            window.location.hash = "#" + counterValue.toFixed(2);
        }

        const showLastUpdateTime = () => {
            document.getElementById("lastUpdate").innerText = "last update: " + formatRelativeTime(lastUpdate, new Date());
        }

        const incrementCounter = (value) => {
            counterValue += value;
            lastUpdate = new Date();
            updateCounter();
        }

        document.getElementById("reset-button").addEventListener("click", () => {
            counterValue = 0;
            updateCounter();
            localStorage.clear();
        });

        const buttons = document.querySelectorAll("[data-increment]");
        for(let i = 0; i < buttons.length; ++i) {
            buttons[i].addEventListener(
                "click", 
                () => incrementCounter(Number(buttons[i].dataset.increment))
            );
        };

        let counterValue = Number(localStorage.getItem("counterValue"));
        if (!counterValue) {
            counterValue = 0.0;
        }
        let lastUpdate = new Date(localStorage.getItem("lastUpdate"));
        if (!lastUpdate) {
            lastUpdate = new Date();
        }
        if (window.location.hash) {
            let hash = window.location.hash;
            counterValue = Number(hash.substring(1));
        }
        updateCounter();

        setInterval(showLastUpdateTime, 1000);
    })();
</script>

</html>
